[pytest]
# pythonpath = . 让测试能 import shared / agent（无需在测试里手动改 sys.path）
pythonpath = .
testpaths = shared agent
python_files = test_*.py
python_functions = test_*
addopts = -v
# 用 logging 而非 print：log_cli 实时显示，失败时 pytest 也会自动附上 captured log
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)s %(name)s: %(message)s
